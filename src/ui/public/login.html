<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>THOR — Access</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-box">
    <div class="login-logo">
      <span class="login-hammer">⚡</span>
      <div class="login-brand">THOR</div>
      <div class="login-tagline">Trading Intelligence System</div>
    </div>
    <form id="login-form">
      <input type="password" id="password" placeholder="Enter password" class="input-field" autofocus>
      <button type="submit" class="btn-primary btn-block">Authenticate</button>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        document.getElementById('login-error').textContent = 'Access denied';
      }
    });
  </script>
</body>
</html>
