<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eToro Bot Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f0f1a;
      color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .logo { font-size: 20px; }
    .header h1 { font-size: 14px; font-weight: 600; color: #fff; }
    .header .sub { font-size: 11px; color: #888; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e30;
    }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #666;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .row:last-child { margin-bottom: 0; }
    .label { color: #aaa; }
    .value { color: #fff; font-weight: 500; }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .dot-green { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot-red   { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .dot-grey  { background: #555; }

    .watchlist {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }
    .tag {
      background: #1e2a4a;
      border: 1px solid #2a3a6a;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      color: #7eb3ff;
      font-weight: 600;
    }

    .time { color: #666; font-size: 11px; }

    .btn {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: #1a3a6a;
      border: 1px solid #2a5aaa;
      border-radius: 6px;
      color: #7eb3ff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #1e4a8a; }

    .footer {
      padding: 8px 16px;
      font-size: 10px;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div>
      <h1>eToro Bot Bridge</h1>
      <div class="sub">Yerel bot bağlantısı</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Bağlantı</div>
    <div class="row">
      <span class="label">Bot sunucusu</span>
      <span class="value" id="serverStatus">
        <span class="dot dot-grey" id="serverDot"></span>
        <span id="serverText">Kontrol ediliyor...</span>
      </span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Son Senkronizasyon</div>
    <div class="row">
      <span class="label">Auth session</span>
      <span class="time" id="lastAuth">—</span>
    </div>
    <div class="row">
      <span class="label">Watchlist</span>
      <span class="time" id="lastWatchlist">—</span>
    </div>
    <div class="row">
      <span class="label">Sayfa yenileme</span>
      <span class="time" id="lastRefresh">—</span>
    </div>
    <div class="row">
      <span class="label">Research sync</span>
      <span class="time" id="lastResearch">—</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Watchlist</div>
    <div class="watchlist" id="watchlistTags">
      <span style="color:#555">Henüz senkronize edilmedi</span>
    </div>
  </div>

  <div class="section">
    <button class="btn" id="forceSync">↺ Watchlist Senkronize Et</button>
    <button class="btn" id="forceResearch" style="margin-top:6px">🔬 Research Şimdi Tara</button>
  </div>

  <div class="footer">localhost:3737 · eToro Bot Bridge v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
